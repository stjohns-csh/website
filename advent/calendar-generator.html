<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ASJ Seasonal Calendar Block</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{font-family:Georgia,serif;max-width:900px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:22px;margin:0 0 4px}p.s{margin:0 0 16px;color:#555;font-size:14px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button{background:#b32d1e;color:#fff;border:0;border-radius:4px;padding:9px 16px;font:bold 14px Georgia,serif;cursor:pointer}
button.alt{background:#fff;color:#b32d1e;border:1px solid #b32d1e}
input[type=date]{font:15px Georgia,serif;padding:6px}
textarea{width:100%;height:180px;font:12px monospace;margin-top:14px}
#preview{max-width:600px;margin:0 auto;border:1px solid #ddd;padding:0 0 24px;background:#fff}
#msg{color:#2a6b2a;font-size:14px}
</style></head><body>
<h1>ASJ Seasonal Calendar Block</h1>
<p class="s">Pick the date the newsletter goes out. Events before that date are dropped. Copy the HTML into the Curator's "Seasonal calendar" box. To reuse for Lent / Holy Week, edit the SETTINGS and EVENTS at the top of the script.</p>
<div class="bar">
 <label>Newsletter date: <input type="date" id="asof"></label>
 <button id="copy">Copy HTML for the Curator</button>
 <button id="ics" class="alt">Download .ics files</button>
 <span id="msg"></span>
</div>
<div id="preview"></div>
<textarea id="out" readonly></textarea>
<script>
// Shared logic: used by build.js (node) and inlined into generator.html (browser).
// To reuse for Lent / Holy Week, only the EVENTS list and SETTINGS need to change.

var SETTINGS = {
  title: "Special Events for Advent & Christmas 2026",
  subtitle: "All events are at St. John’s Church unless otherwise noted.",
  churchLocation: "St. John’s Church, 1670 Route 25A, Cold Spring Harbor, NY 11724",
  // Where the .ics files will be uploaded on the website. CONFIRM THIS PATH.
  icsBaseUrl: "https://www.stjcsh.org/calendar/",
  accent: "#b32d1e",
  tz: "America/New_York"
};

// date = "YYYY-MM-DD", start/end = "HH:MM" (24h). Ticketed events get a ticket button instead of calendar links.
var EVENTS = [
  { slug: "magnify-2026", title: "Magnify – Mary’s Song and the Magnificent Women of Advent",
    titleLines: ["Magnify – Mary’s Song and", "the Magnificent Women of Advent"],
    dates: ["2026-11-29", "2026-12-06", "2026-12-13", "2026-12-20"], weekly: true,
    start: "09:00", end: "09:45", lead: "Sundays in Advent", timeText: "9–9:45 am",
    },
  { slug: "pageant-signup-wreath-making", title: "Christmas Pageant Signup & Advent Wreath Making",
    dates: ["2026-11-29"], start: "11:00", end: "12:00", timeText: "11 am" },
  { slug: "trio-mediaeval", title: "Concerts by the Pond Presents: Trio Mediaeval",
    blurb: "The Grammy-nominated vocal trio presents YULE, a Scandinavian Holiday program.",
    dates: ["2026-12-05"], start: "19:30", timeText: "7:30 pm (ticketed)",
    ticketUrl: "https://www.tix.com/ticket-sales/CBTP/7340/event/1468828" },
  { slug: "pageant-casting-costuming", title: "Christmas Pageant Casting and Costuming",
    dates: ["2026-12-06"], start: "11:00", end: "12:00", timeText: "11 am" },
  { slug: "carol-messiah-singalong", title: "4th Annual Community Christmas Carol and Messiah Sing-along",
    titleLines: ["4th Annual Community Christmas Carol", "and Messiah Sing-along"],
    blurb: "benefitting St. Matthias School & Church in Haiti",
    dates: ["2026-12-06"], start: "15:00", end: "16:00", timeText: "3 pm" },
  { slug: "holiday-swing-ii", title: "Concerts by the Pond Presents: Holiday Swing II",
    blurb: "Swing into the Season with vocalist April Varner and pianist Konrad Paszkudzki",
    dates: ["2026-12-12"], start: "19:30", timeText: "7:30 pm (ticketed)",
    ticketUrl: "https://www.tix.com/ticket-sales/CBTP/7340/event/1468829" },
  { slug: "village-caroling", title: "Christmas Caroling in Cold Spring Harbor Village",
    dates: ["2026-12-19"], start: "13:00", end: "14:00", timeText: "1 pm – meet at the CSH Firehouse Museum",
    location: "Cold Spring Harbor Firehouse Museum, Cold Spring Harbor, NY" },
  { slug: "greening-of-the-church", title: "Greening of the Church",
    dates: ["2026-12-19"], start: "15:00", end: "16:00", timeText: "3 pm" },
  { slug: "lessons-and-carols", title: "Christmas Festival Service of Lesson and Carols",
    lead: "4th Sunday of Advent",
    dates: ["2026-12-20"], start: "10:00", end: "11:00", timeText: "10 am" },
  { group: "Christmas Eve Services, Thursday, December 24", items: [
    { slug: "christmas-eve-4pm", title: "Christmas Pageant and Carol Sing", dates: ["2026-12-24"], start: "16:00", end: "17:00", timeText: "4 pm" },
    { slug: "christmas-eve-6pm", title: "Holy Eucharist with Harp and Chancel Choir", dates: ["2026-12-24"], start: "18:00", end: "19:00", timeText: "6 pm" },
    { slug: "christmas-eve-10pm", title: "Holy Eucharist with Harp and Vocal Soloists", dates: ["2026-12-24"], start: "22:00", end: "23:00", timeText: "10 pm" }
  ] },
  { slug: "christmas-day", title: "Christmas Day Service, Friday, December 25",
    lead: "Holy Eucharist", noDate: true, dates: ["2026-12-25"], start: "10:00", end: "11:00", timeText: "10 am",
    calTitle: "Christmas Day Holy Eucharist" }
];

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function noOrphan(t) {
  var h = esc(t).replace(/(\S+)-(\S+)/g, '<span style="white-space:nowrap;">$1-$2</span>');
  return h.replace(/ (?=[^ ]*$)/, "&nbsp;");
}
function titleHtml(ev) { return (ev.titleLines || [ev.title]).map(noOrphan).join("<br>"); }
function compact(date, hhmm) { return date.replace(/-/g, "") + "T" + hhmm.replace(":", "") + "00"; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function remainingDates(ev, asOf) { return ev.dates.filter(function (d) { return d >= asOf; }); }

function flatEvents(events) {
  var out = [];
  events.forEach(function (e) { if (e.group) e.items.forEach(function (i) { out.push(i); }); else out.push(e); });
  return out;
}

function monthDay(date) {
  var m = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var p = date.split("-"); return m[+p[1] - 1] + " " + (+p[2]);
}
function weekday(date) {
  var p = date.split("-").map(Number);
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(p[0], p[1] - 1, p[2]).getDay()];
}

// "Sundays in Advent, November 29 & December 6, 13, 20, 9am - 9:45am" style line, built from remaining dates
function dateLine(ev, dates) {
  if (ev.weekly) {
    var parts = [], lastMonth = null;
    dates.forEach(function (d) {
      var md = monthDay(d).split(" ");
      parts.push(md[0] !== lastMonth ? md[0] + " " + md[1] : md[1]); lastMonth = md[0];
    });
    var s = parts.length > 1 ? parts.slice(0, -1).join(", ") + " & " + parts[parts.length - 1] : parts[0];
    return (dates.length > 1 ? ev.lead : ev.lead.replace(/^Sundays/, "Sunday")) + ", " + s + ", " + ev.timeText;
  }
  var d = dates[0];
  if (ev.lead) return ev.lead + ", " + (ev.noDate ? "" : monthDay(d) + ", ") + ev.timeText;
  var base = weekday(d) + ", " + monthDay(d) + ", " + ev.timeText;
  return base;
}

function googleLink(ev, dates, s) {
  var first = dates[0];
  var loc = ev.location || s.churchLocation;
  var q = "action=TEMPLATE&text=" + encodeURIComponent(ev.calTitle || ev.title) +
    "&dates=" + compact(first, ev.start) + "/" + compact(first, ev.end) +
    "&ctz=" + encodeURIComponent(s.tz) +
    "&location=" + encodeURIComponent(loc) +
    "&details=" + encodeURIComponent("St. John’s Episcopal Church, Cold Spring Harbor");
  if (ev.weekly && dates.length > 1) q += "&recur=" + encodeURIComponent("RRULE:FREQ=WEEKLY;COUNT=" + dates.length);
  return "https://calendar.google.com/calendar/render?" + q;
}

function icsText(ev, dates, s) {
  var first = dates[0], loc = ev.location || s.churchLocation;
  var fold = function (l) { return l; };
  var lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//St. John's Cold Spring Harbor//Events//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VTIMEZONE", "TZID:America/New_York",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:-0500", "TZOFFSETTO:-0400", "TZNAME:EDT", "DTSTART:19700308T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:-0400", "TZOFFSETTO:-0500", "TZNAME:EST", "DTSTART:19701101T020000", "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU", "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT",
    "UID:" + ev.slug + "-" + first + "@stjcsh.org",
    "DTSTAMP:20261124T140000Z",
    "DTSTART;TZID=America/New_York:" + compact(first, ev.start),
    "DTEND;TZID=America/New_York:" + compact(first, ev.end),
    "SUMMARY:" + (ev.calTitle || ev.title).replace(/,/g, "\\,"),
    "LOCATION:" + loc.replace(/,/g, "\\,"),
    "DESCRIPTION:St. John's Episcopal Church\\, Cold Spring Harbor"
  ];
  if (ev.weekly && dates.length > 1) lines.push("RRULE:FREQ=WEEKLY;COUNT=" + dates.length);
  lines.push("END:VEVENT", "END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}

// Newsletter look: same palette, fonts, button and divider as the builder's own sections.
var C = { navy: "#BF0000", teal: "#BF0000", tealDeep: "#2C3539", charcoal: "#2C3539", mute: "#6B7170", hair: "#D9DFDD" };
var HEAD = "font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;";
var BODY = "font-family:'PT Sans',Helvetica,Arial,sans-serif;";

function calLinks(ev, dates, s) {
  var st = "color:" + C.navy + ";text-decoration:underline;" + BODY + "font-size:13px;";
  var dim = BODY + "font-size:13px;color:" + C.mute + ";";
  return '<span style="' + dim + '">Add to calendar: </span>' +
    '<a href="' + esc(googleLink(ev, dates, s)) + '" style="' + st + '">Google</a>' +
    '<span style="' + dim + '"> &middot; </span>' +
    '<a href="' + esc(s.icsBaseUrl + ev.slug + ".ics") + '" style="' + st + '">Apple / Outlook</a>';
}

function ticketButton(ev) {
  return '<a href="' + esc(ev.ticketUrl) + '" style="display:inline-block;background:' + C.navy + ';color:#FFFFFF;' + BODY +
    'font-weight:700;font-size:14px;letter-spacing:0.3px;text-decoration:none;padding:12px 22px;border:2px solid ' + C.navy + ';">Buy Tickets &rarr;</a>';
}

function divider() {
  return '<tr><td style="padding:18px 32px 0;text-align:center;"><table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;"><tr><td width="56" style="width:56px;height:1px;background:' + C.hair + ';font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>\n';
}

function titleDiv(html) { return '<div style="' + HEAD + 'font-weight:600;font-size:22px;line-height:1.2;color:' + C.navy + ';">' + html + '</div>'; }
function metaDiv(text) { return '<div style="' + BODY + 'font-weight:700;font-size:13px;letter-spacing:0.3px;color:' + C.tealDeep + ';margin-top:8px;">' + noOrphan(text) + '</div>'; }

function eventBlock(ev, s, asOf) {
  var dates = remainingDates(ev, asOf);
  if (!dates.length) return "";
  var h = '<tr><td style="padding:18px 32px 0;text-align:center;">' + titleDiv(titleHtml(ev));
  h += metaDiv(dateLine(ev, dates));
  if (ev.blurb) h += '<div style="' + BODY + 'font-size:15px;line-height:1.6;color:' + C.charcoal + ';margin-top:8px;">' + noOrphan(ev.blurb) + '</div>';
  h += '<div style="margin:14px 0 4px;text-align:center;">' + (ev.ticketUrl ? ticketButton(ev) : calLinks(ev, dates, s)) + '</div>';
  return h + '</td></tr>\n';
}

function groupBlock(g, s, asOf) {
  var live = g.items.filter(function (i) { return remainingDates(i, asOf).length; });
  if (!live.length) return "";
  var h = '<tr><td style="padding:18px 32px 0;text-align:center;">' + titleDiv(noOrphan(g.group));
  live.forEach(function (i) {
    h += '<div style="margin-top:10px;"><div style="' + BODY + 'font-size:15px;line-height:1.5;color:' + C.charcoal + ';">' + noOrphan(i.title + ", " + i.timeText) + '</div>' +
         '<div style="margin-top:2px;text-align:center;">' + calLinks(i, remainingDates(i, asOf), s) + '</div></div>';
  });
  return h + '</td></tr>\n';
}

function buildBlock(events, asOf, s) {
  var parts = events.map(function (e) { return e.group ? groupBlock(e, s, asOf) : eventBlock(e, s, asOf); }).filter(Boolean);
  var rows = parts.join(divider());
  return '<!-- Seasonal calendar block, events on/after ' + asOf + '. Paste into the Curator\'s "Seasonal calendar" box. -->\n' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">\n' +
    '<tr><td style="padding:16px 32px 0;text-align:center;"><div style="' + HEAD + 'font-style:italic;font-weight:500;font-size:24px;color:' + C.navy + ';line-height:1.1;">' + esc(s.title) + '</div>' +
    '<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:10px auto 0;"><tr><td width="72" style="width:72px;height:2px;background:' + C.teal + ';font-size:0;line-height:0;">&nbsp;</td></tr></table>' +
    '<div style="' + BODY + 'font-style:italic;font-size:14px;color:' + C.mute + ';margin-top:10px;">' + esc(s.subtitle) + '</div></td></tr>\n' +
    rows +
    '</table>';
}


var asof=document.getElementById('asof');
asof.value=ymd(new Date());
function render(){var h=buildBlock(EVENTS,asof.value,SETTINGS);document.getElementById('preview').innerHTML=h;document.getElementById('out').value=h;}
asof.addEventListener('change',render);render();
function say(t){var m=document.getElementById('msg');m.textContent=t;setTimeout(function(){m.textContent=''},3000)}
document.getElementById('copy').onclick=function(){var o=document.getElementById('out');o.select();(navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).then(function(){say('Copied.')},function(){document.execCommand('copy');say('Copied.')})};
document.getElementById('ics').onclick=function(){
 var evs=flatEvents(EVENTS).filter(function(e){return !e.ticketUrl&&remainingDates(e,asof.value).length});
 evs.forEach(function(e,i){setTimeout(function(){var b=new Blob([icsText(e,remainingDates(e,asof.value),SETTINGS)],{type:'text/calendar'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=e.slug+'.ics';document.body.appendChild(a);a.click();a.remove();},i*400)});
 say('Downloading '+evs.length+' files. Upload them to '+SETTINGS.icsBaseUrl);
};
</script></body></html>
